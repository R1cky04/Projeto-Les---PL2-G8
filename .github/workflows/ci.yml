name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend lint, tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pl2g8_ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma clients
        run: npx prisma generate

      - name: Static analysis
        run: npx eslint "src/**/*.ts" "test/**/*.ts"

      - name: Unit tests
        run: npm test -- --runInBand

      - name: Contract and integration tests
        run: npm run test:e2e -- --runInBand

      - name: Build
        run: npm run build

  frontend:
    name: Frontend lint, tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify Electron install
        run: node -e "require('electron')"

      - name: Static analysis
        run: npm run lint -- --no-fix

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
